[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xray-agent"
version = "0.1.0"
description = "Evidence-backed software reconnaissance and architecture inference tool"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "rich>=13.0",
    "PyYAML>=6.0",
    "GitPython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-PyYAML",
]

[project.scripts]
xray = "xray.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["xray"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
